<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Cantinho 💗</title>

    <!-- Fonte bonita -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Elementos decorativos -->
    <div class="coracao coracao1">💗</div>
    <div class="coracao coracao2">💖</div>
    <div class="coracao coracao3">💕</div>
    <div class="coracao coracao4">💗</div>

    <div class="estrela estrela1">✦</div>
    <div class="estrela estrela2">✧</div>
    <div class="estrela estrela3">✦</div>

    <!-- Cartão principal -->
    <main class="cartao">

        <div class="icone">
            🌸
        </div>

        <h1>
            Meu Cantinho Especial
        </h1>

        <p class="subtitulo">
            Uma pequena página feita com HTML, CSS e JavaScript 💕
        </p>

        <!-- Área onde a mensagem será alterada -->
        <div class="caixa-mensagem">

            <span class="brilho">✨</span>

            <p class="mensagem">
                Clique no botão abaixo para descobrir uma mensagem especial!
            </p>

            <span class="brilho">✨</span>

        </div>

        <!-- Botão -->
        <button class="botao" id="botao">

            <span>💗</span>
            Mostrar mensagem
            <span>💗</span>

        </button>

        <p class="rodape">
            Feito com carinho 🌷✨
        </p>

    </main>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
